name: Check OKX USDT Swap API

on:
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Request BTC-USDT-SWAP daily candles
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1Dutc&limit=2"

      - name: Request BTC-USDT-SWAP last price
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT-SWAP"
