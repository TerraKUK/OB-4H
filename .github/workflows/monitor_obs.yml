name: Monitor Active Order Blocks

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only write planned Telegram messages to the log"
        required: false
        default: false
        type: boolean

concurrency:
  group: ob-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests pandas

      - name: Monitor active Order Blocks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_ZONE_AGE_DAYS: "45"
        run: python scripts/monitor_obs.py

      - name: Save updated zone state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state
          git diff --cached --quiet || git commit -m "Update active OB state"
          git push
