name: Scan 4H Order Blocks

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print signals; do not send Telegram messages or save state"
        required: true
        default: true
        type: boolean

concurrency:
  group: h4-shared-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Check OKX 4H candles API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=4H&limit=2"
      - name: Download closed and current 4H candles
        env:
          H4_DAYS_BACK: "180"
        run: python scripts/download_data_h4.py
      - name: Scan new strong H4 Order Blocks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MIN_OB_SCORE: "4"
          NEW_OB_LOOKBACK_HOURS: "12"
          FORMING_OB_LOOKBACK_HOURS: "8"
          FORMING_OB_MAX_AGE_HOURS: "16"
          FORMING_OB_DISPLACEMENT_ATR: "1.0"
        run: python scripts/scan_obs_h4.py
      - name: Save H4 scanner state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_h4 data/state/active_obs_h4.json
          git diff --cached --quiet || git commit -m "Update H4 Order Block state"
          git push
