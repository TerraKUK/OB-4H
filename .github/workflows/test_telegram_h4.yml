name: Test H4 Telegram Bot

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send direct-message test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ H4-бот подключён. Здесь будут новые подтверждённые regular RSI-дивергенции по OKX USDT perpetual swaps (4H). Пример графика: https://www.tradingview.com/chart/?symbol=OKX%3ABTCUSDT.P&interval=240" \
            --data-urlencode "disable_web_page_preview=true"
